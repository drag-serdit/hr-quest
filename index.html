<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HR-Квест</title>
<script src="https://telegram.org"></script>
<style>
*{box-sizing:border-box}body{font-family:sans-serif;background:#f1f5f9;color:#0f172a;margin:0;padding:16px;display:flex;justify-content:center}.box{width:100%;max-width:480px;background:#fff;border-radius:16px;padding:20px;box-shadow:0 4px 12px rgba(0,0,0,.08)}.top{display:flex;justify-content:space-between;font-size:13px;color:#64748b;font-weight:700;margin-bottom:8px}.bar-bg{width:100%;height:8px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin-bottom:20px}.bar{height:100%;background:#2563eb;width:0%;transition:.3s}h1{font-size:18px;margin:0 0 10px}p{font-size:15px;line-height:1.5;color:#334155;margin:0 0 18px}.btn{display:block;width:100%;padding:14px;margin-bottom:10px;background:#f8fafc;border:1px solid #cbd5e1;border-radius:12px;font-size:14px;text-align:left;color:#1e293b;cursor:pointer;line-height:1.4}.btn:hover{background:#eff6ff;border-color:#3b82f6}.act{background:#2563eb;color:#fff;border:none;text-align:center;font-weight:700}.err{background:#fef2f2;border-left:4px solid #dc2626;color:#991b1b;padding:16px;border-radius:12px;font-size:14px;line-height:1.5;margin-bottom:14px}.win{background:#fffbeb;border:2px solid #f59e0b;border-radius:14px;padding:20px;text-align:center;margin-bottom:14px}.off{background:#fff;border-radius:10px;padding:12px;margin-top:14px;text-align:left;font-size:14px;line-height:1.6}
</style></head><body><div class="box"><div class="top"><span id="st">Этап 1 из 10</span><span id="er">Ошибок: 0</span></div><div class="bar-bg"><div class="bar" id="bar"></div></div><div id="app"></div></div>
<script>
if(window.Telegram&&window.Telegram.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand();}
var q=[];
q.push({g:"Ловушка 1",t:"1. Анализ условий найма",x:"Обещают: оклад 30 000 руб. по ТК + премия 90 000 руб. в конверте. Ваши действия?",o:[{t:"А. Соглашусь, на руки выходит 120 000 руб. — выше рынка",ok:0,m:"Ловушка серой схемы! Премию могут не выплатить, а отпускные считают только от 30 000 руб."},{t:"Б. Откажусь и продолжу искать полностью белое оформление",ok:1},{t:"В. Попрошу расписку о размере премии",ok:0,m:"Расписка о серой зарплате не имеет силы в суде."}]});
q.push({g:"Ловушка 2",t:"2. Оформление резюме",x:"Чтобы выделиться, вы сделали резюме в виде инфографики с картинками и колонками. В чем подвох?",o:[{t:"А. Отлично! Рекрутер сразу увидит креатив",ok:0,m:"Ловушка роботов ATS! Они не читают текст с картинок — резюме улетит в корзину."},{t:"Б. Сделаю текстовое резюме по шаблону портала, а портфолио дам ссылкой",ok:1},{t:"В. Вставлю скриншоты дипломов вместо текста",ok:0,m:"Алгоритмы не индексируют текст на изображениях."}]});
q.push({g:"Ловушка 3",t:"3. Проверка на искренность",x:"Вопрос HR: Назовите вашу слабую сторону. Какой ответ НЕ сработает?",o:[{t:"А. Я перфекционист, слишком много работаю",ok:0,m:"Ловушка шаблона! HR слышит это постоянно и считает уходом от ответа."},{t:"Б. Увлекаюсь деталями при анализе, поэтому ставлю таймер на этапы",ok:1},{t:"В. У меня нет слабых сторон",ok:0,m:"Отсутствие самокритики говорит о низкой осознанности."}]});
q.push({g:"Ловушка 4",t:"4. Лояльность",x:"Почему ушли с прошлой практики? На самом деле руководитель кричал и срывал сроки. Что скажете?",o:[{t:"А. Честно расскажу, что руководитель был токсичным",ok:0,m:"Ловушка критики! HR подумает, что скоро вы так же отзоветесь об их компании."},{t:"Б. Получил базовый опыт, хочу расти в системной команде с четкими KPI",ok:1},{t:"В. Стало скучно, захотелось нового",ok:0,m:"Сигнал рекрутеру, что вы быстро теряете интерес."}]});
q.push({g:"Ловушка 5",t:"5. Проверка мотивации",x:"HR спрашивает: Кем видите себя через 5 лет? Вы хотите быстро стать начальником. Как ответить?",o:[{t:"А. Через 2 года займу место начальника этого отдела",ok:0,m:"Ловушка амбиций! Начальник отдела увидит в вас конкурента и откажет."},{t:"Б. Хочу стать сильным экспертом в команде и брать сложные проекты",ok:1},{t:"В. Не загадываю, рынок слишком быстро меняется",ok:0,m:"Ощущение, что компания для вас — временный вариант."}]});
q.push({g:"Ловушка 6",t:"6. Эмоциональный интеллект",x:"Интервьюер перебивает: Судя по резюме, вы не справитесь с нашим темпом. Ваша реакция?",o:[{t:"А. Начну эмоционально доказывать, что он плохо читал резюме",ok:0,m:"Ловушка провокации! Проверяют вашу реакцию на давление."},{t:"Б. Спокойно уточню, какие задачи требуют темпа, и приведу свой кейс",ok:1},{t:"В. Молча соглашусь и опущу глаза",ok:0,m:"Пассивность подтверждает сомнения в вашей стрессоустойчивости."}]});
q.push({g:"Ловушка 7",t:"7. Защита труда",x:"До собеседования просят сделать стратегию на 15 слайдов за 2 дня. В чем риск?",o:[{t:"А. Выполню всё — это докажет мотивацию",ok:0,m:"Ловушка бесплатного труда! Так собирают бесплатные идеи с рынка."},{t:"Б. Предложу сделать 1-2 идеи или полное ТЗ после знакомства с руководителем",ok:1},{t:"В. Поставлю на слайды водяные знаки на весь экран",ok:0,m:"Это мешает чтению, лучше сразу согласовать объем."}]});
q.push({g:"Ловушка 8",t:"8. Позиционирование",x:"В начале встречи, до рассказа о задачах, HR спрашивает: Сколько денег хотите?",o:[{t:"А. Назову минимум, чтобы точно не отсеяли",ok:0,m:"Ловушка демпинга! Рискуете получить огромный объем работы за копейки."},{t:"Б. Уточню объем задач и KPI, ориентируюсь по рынку на 65-75 тыс. руб.",ok:1},{t:"В. А сколько у вас заложено в бюджете?",ok:0,m:"Прямой возврат вопроса без своей вилки выглядит как уход от ответа."}]});
q.push({g:"Ловушка 9",t:"9. Выбор оффера",x:"Вы получили оффер, но текущее место стажировки вдруг предлагает +10% к ставке. Что говорят исследования HR?",o:[{t:"А. Останусь на старом месте — не надо адаптироваться",ok:0,m:"Ловушка контроффера! До 80% принявших его уходят в течение года, доверие уже подорвано."},{t:"Б. Поблагодарю, но приму новый оффер с лучшим ростом",ok:1},{t:"В. Начну аукцион между компаниями, требуя +30%",ok:0,m:"Агрессивный торг на старте часто ведет к отзыву обоих офферов."}]});
q.push({g:"Ловушка 10",t:"10. Испытательный срок",x:"Чтобы понравиться команде, вы берете чужие задачи и сидите до 21:00. К чему это приведет?",o:[{t:"А. Через 3 месяца гарантированно повысят",ok:0,m:"Ловушка выгорания! Команда привыкнет к бесплатной помощи, а босс решит, что вы не успеваете."},{t:"Б. Сфокусируюсь на своих KPI в рабочее время и сверю приоритеты с руководителем",ok:1},{t:"В. Буду уходить ровно в 18:00 даже при горящем дедлайне",ok:0,m:"Демонстративность на испытательном сроке покажет низкую вовлеченность."}]});
var s=0,e=0,abc=["А. ","Б. ","В. "];
function shareRes(){
var txt="🏆 Я прошел HR-квест «Работа мечты»!\n📊 Количество ошибок: "+e+" из 10.";
var link="https://t.me"+encodeURIComponent("https://t.me")+"&text="+encodeURIComponent(txt);
if(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.openTelegramLink){
window.Telegram.WebApp.openTelegramLink(link);
}else{
window.location.href=link;
}
}
function copyRes(){
var txt="🏆 Я прошел HR-квест «Работа мечты»!\n📊 Результат: "+e+" ошибок из 10.\n👉 Пройти квест: https://t.me";
navigator.clipboard.writeText(txt).then(function(){alert("✅ Результат скопирован! Вставьте его в чат группы.");});
}
function draw(err){
var c=document.getElementById("app");document.getElementById("bar").style.width=(s/q.length*100)+"%";document.getElementById("er").innerText="Ошибок: "+e;c.innerHTML="";
if(err){document.getElementById("st").innerText="Этап "+(s+1)+" из "+q.length;var d=document.createElement("div");d.className="err";d.innerText="❌ "+err;c.appendChild(d);var b=document.createElement("button");b.className="btn act";b.innerText="🔄 Попробовать этот этап снова";b.onclick=function(){draw()};c.appendChild(b);return;}
if(s>=q.length){
document.getElementById("st").innerText="Финал пройден!";var r=e===0?"🏆 Эксперт HR (0 ошибок!)":e<=3?"🥈 Сильный кандидат":"🥉 Упорный соискатель";var w=document.createElement("div");w.className="win";w.innerHTML="<div style='font-size:48px'>🏆</div><h1 style='color:#92400e;margin-top:8px'>РАБОТА МЕЧТЫ ВАША!</h1><div style='font-weight:700;color:#78350f'>"+r+"</div><div class='off'><b>📄 Ваш оффер:</b><br>• <b>Должность:</b> Специалист мечты<br>• <b>Оформление:</b> Белый оклад по ТК РФ<br>• <b>Зарплата:</b> Выше рынка + KPI<br>• <b>Условия:</b> Адекватный руководитель</div>";c.appendChild(w);var sb=document.createElement("button");sb.className="btn act";sb.style.background="#d97706";sb.innerText="📤 Отправить результат в чат";sb.onclick=shareRes;c.appendChild(sb);var cb=document.createElement("button");cb.className="btn act";cb.innerText="📋 Скопировать результат";cb.onclick=copyRes;c.appendChild(cb);var rb=document.createElement("button");rb.className="btn";rb.style.textAlign="center";rb.innerText="🔁 Пройти заново";rb.onclick=function(){s=0;e=0;draw()};c.appendChild(rb);return;
}
document.getElementById("st").innerText="Этап "+(s+1)+" из "+q.length;var it=q[s];var t=document.createElement("h1");t.innerText=it.t;c.appendChild(t);var p=document.createElement("p");p.innerText=it.x;c.appendChild(p);
var sh=it.o.slice().sort(function(){return Math.random()-0.5});
sh.forEach(function(o,idx){var b=document.createElement("button");b.className="btn";b.innerText=(abc[idx]||"")+o.t.replace(/^[АБВ]\.\s*/,"");b.onclick=function(){if(o.ok){s++;draw()}else{e++;draw(o.m)}};c.appendChild(b);});
}draw();
</script></body></html>
